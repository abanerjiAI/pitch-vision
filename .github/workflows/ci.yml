name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Unit tests
        run: node tests/run.js
      - name: Every source file parses
        run: |
          for f in src/*.js tools/*.mjs tests/*.js; do
            node --check "$f" || exit 1
          done
